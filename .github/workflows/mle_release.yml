name: mle_release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    cc: musl-gcc, extra: 'mle_static=1', label: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, cc: musl-gcc, extra: 'mle_static=1', label: linux-aarch64 }
          - { runner: macos-latest,     cc: cc,       extra: '',             label: macos }
          - { runner: ubuntu-latest,    cc: cosmocc,  extra: 'AR=cosmoar',   label: cosmo }

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install_musl
        if: matrix.cc == 'musl-gcc'
        run: sudo apt-get install -y musl-tools

      - name: install_cosmo
        if: matrix.cc == 'cosmocc'
        run: |
          wget -q -O cosmocc.zip 'https://cosmo.zip/pub/cosmocc/cosmocc.zip'
          mkdir -vp ~/cosmocc
          unzip cosmocc.zip -d ~/cosmocc
          echo "$HOME/cosmocc/bin" >>"$GITHUB_PATH"

      - name: build
        run: make release mle_vendor=1 CC=${{ matrix.cc }} ${{ matrix.extra }} mle_dist_tag=${{ matrix.label }}

      - name: upload_binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/mle-code_*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: always() && github.event_name == 'release' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: download
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: collect
        run: |
          mkdir -p dist
          find incoming -type f -name 'mle-code_*' -exec cp -v {} dist/ \;
          test -n "$(find dist -name 'mle-code_*' -print -quit)"
          (cd dist && sha256sum mle-code_* > SHA256SUMS)
          ls -l dist

      - name: upload_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mle-code_*
            dist/SHA256SUMS
